<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="筋トレ">
<meta name="theme-color" content="#D6302C">
<!-- vite-ignore: Vite に触らせない（名前に指紋を付けられると、ホーム画面のアプリが壊れる） -->
<link rel="manifest" href="manifest.json" vite-ignore>
<link rel="apple-touch-icon" href="icon-192.png" vite-ignore>
<title>筋トレ記録</title>
<!-- 見た目は Vite に触らせず、そのまま公開する（vite-ignore） -->
<link rel="stylesheet" href="css/app.css" vite-ignore>
<script type="module" src="src/main.ts"></script>
</head>
<body>

<div class="header">
  <h1>💪 筋トレ記録</h1>
</div>

<div id="install-banner">
  <span>ホーム画面に追加できます</span>
  <button class="btn btn-sm btn-primary" id="install-btn">追加</button>
  <button class="btn btn-sm" id="install-close">✕</button>
</div>

<div class="content">

<!-- LOG -->
<div class="section active" id="sec-log">
  <div class="card">
    <div style="font-size:13px;color:var(--text2);margin-bottom:12px" id="log-date"></div>
    <div style="margin-bottom:10px">
      <label class="lbl">種目</label>
      <select id="ex-sel"></select>
    </div>
    <div class="row3" style="margin-bottom:10px">
      <div><label class="lbl">重量 (kg)</label><input type="number" id="w-kg" placeholder="60" step="0.5" min="0" inputmode="decimal"></div>
      <div><label class="lbl">回数</label><input type="number" id="w-reps" placeholder="10" min="1" inputmode="numeric"></div>
      <div><label class="lbl">RPE</label><input type="number" id="w-rpe" placeholder="8" min="1" max="10" step="0.5" inputmode="decimal"></div>
    </div>
    <div style="margin-bottom:12px">
      <label class="lbl">メモ（任意）</label>
      <textarea id="w-note" placeholder="フォーム・体調など..."></textarea>
    </div>
    <div style="display:flex;gap:8px">
      <button class="btn btn-primary" style="flex:1" data-action="add-set">＋ セット追加</button>
      <button class="btn" data-action="go-timer">⏱ レスト</button>
    </div>
  </div>

  <div id="sets-area"></div>

  <div style="display:flex;gap:8px;margin-top:4px">
    <button class="btn btn-primary btn-block" style="flex:1" data-action="save-workout">💾 保存</button>
    <button class="btn btn-danger" data-action="clear-sets">🗑</button>
  </div>
</div>

<!-- TIMER -->
<div class="section" id="sec-timer">
  <div class="card" style="text-align:center">
    <div style="font-size:14px;font-weight:500;margin-bottom:4px">レストタイマー</div>
    <div class="timer-big" id="t-display">01:30</div>
    <div class="timer-bar"><div class="timer-fill" id="t-fill" style="width:100%"></div></div>
    <div style="font-size:13px;color:var(--text2);margin-bottom:16px" id="t-status">準備完了</div>
    <div class="preset-row">
      <button class="preset-btn" data-action="set-dur" data-sec="60">1分</button>
      <button class="preset-btn" data-action="set-dur" data-sec="90">1分30秒</button>
      <button class="preset-btn" data-action="set-dur" data-sec="120">2分</button>
      <button class="preset-btn" data-action="set-dur" data-sec="180">3分</button>
      <button class="preset-btn" data-action="set-dur" data-sec="300">5分</button>
    </div>
    <div style="display:flex;gap:8px;justify-content:center">
      <button class="btn btn-primary" id="t-btn" data-action="toggle-timer" style="min-width:120px">▶ スタート</button>
      <button class="btn" data-action="reset-timer">↺ リセット</button>
    </div>
  </div>
  <div class="card">
    <div style="font-size:14px;font-weight:500;margin-bottom:10px">カスタム時間</div>
    <div class="row2">
      <div><label class="lbl">分</label><input type="number" id="c-min" value="1" min="0" max="99" inputmode="numeric"></div>
      <div><label class="lbl">秒</label><input type="number" id="c-sec" value="30" min="0" max="59" inputmode="numeric"></div>
    </div>
    <button class="btn btn-block" style="margin-top:8px" data-action="set-custom">セット</button>
  </div>
</div>

<!-- CALENDAR -->
<div class="section" id="sec-cal">
  <div class="cal-header">
    <button class="cal-nav" data-action="change-month" data-dir="-1">‹</button>
    <span class="cal-title" id="cal-title"></span>
    <button class="cal-nav" data-action="change-month" data-dir="1">›</button>
  </div>
  <div class="cal-grid" id="cal-grid"></div>
  <div style="display:flex;gap:12px;font-size:12px;color:var(--text2);margin-bottom:16px;align-items:center">
    <span style="display:flex;align-items:center;gap:4px"><span style="width:10px;height:10px;border-radius:50%;background:var(--accent);display:inline-block"></span>記録あり</span>
  </div>
  <div id="cal-detail"></div>
  <div class="redstat-grid" id="cal-redstats"></div>
  <div style="font-size:13px;color:var(--text2);margin-bottom:8px;font-weight:500">直近52週</div>
  <div class="streak-grid" id="streak"></div>
</div>

<!-- HISTORY -->
<div class="section" id="sec-hist">
  <div id="hist-list"></div>
</div>

<!-- EXERCISES -->
<div class="section" id="sec-ex">
  <div class="card">
    <div style="font-size:14px;font-weight:500;margin-bottom:10px">種目を追加</div>
    <div style="display:flex;gap:8px">
      <input type="text" id="new-ex-input" placeholder="例: ケーブルロウ" style="flex:1">
      <button class="btn btn-primary" data-action="add-ex">追加</button>
    </div>
  </div>
  <div id="ex-list"></div>

  <div class="card">
    <div style="font-size:14px;font-weight:500;margin-bottom:4px">📦 データのバックアップ</div>
    <div style="font-size:12px;color:var(--text2);margin-bottom:12px">アプリ更新やデバイス移行の前に、必ずエクスポートしておくと安心です。</div>
    <div style="display:flex;gap:8px;margin-bottom:8px">
      <button class="btn btn-primary" style="flex:1" data-action="export-data">⬇ エクスポート</button>
      <button class="btn" style="flex:1" data-action="pick-import">⬆ インポート</button>
    </div>
    <input type="file" id="import-file" accept="application/json" style="display:none">
    <div id="backup-status" style="font-size:12px;color:var(--text2)"></div>
  </div>
</div>

<!-- STATS -->
<div class="section" id="sec-stats">
  <div class="redstat-section-lbl" id="stats-month-lbl">今月のサマリー</div>
  <div class="redstat-grid" id="stats-redstats"></div>
  <div class="redstat-section-lbl">全期間の統計</div>
  <div class="stat-grid" id="stats-top"></div>
  <div class="card">
    <div style="font-size:14px;font-weight:500;margin-bottom:10px">推定1RM（種目別）</div>
    <div id="rm-list"></div>
  </div>
  <div class="card">
    <div style="font-size:14px;font-weight:500;margin-bottom:10px">ボリューム（種目別）</div>
    <div id="vol-list"></div>
  </div>
</div>

</div><!-- /content -->

<!-- Bottom nav -->
<nav class="bottom-nav">
  <button class="nav-item active" data-action="tab" data-tab="log"><span class="icon">🏋️</span><span>記録</span></button>
  <button class="nav-item" data-action="tab" data-tab="timer"><span class="icon">⏱</span><span>タイマー</span></button>
  <button class="nav-item" data-action="tab" data-tab="cal"><span class="icon">📅</span><span>カレンダー</span></button>
  <button class="nav-item" data-action="tab" data-tab="hist"><span class="icon">📋</span><span>履歴</span></button>
  <button class="nav-item" data-action="tab" data-tab="ex"><span class="icon">⚙️</span><span>種目</span></button>
  <button class="nav-item" data-action="tab" data-tab="stats"><span class="icon">📊</span><span>統計</span></button>
</nav>

<div id="toast"></div>

</body>
</html>
